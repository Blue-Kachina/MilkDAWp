name: Release

# Phase 6.5: tag -> Release build per platform (real identity, D1) -> sign
# where it's free (D11) -> package -> GitHub Release with generated notes,
# SHA-256 checksums and build provenance attestations.
#
#   git tag v1.0.0-beta.1 && git push origin v1.0.0-beta.1
#
# A tag with a suffix ("-beta.1", "-rc.1") publishes a pre-release. The tag's
# numbers must equal project(VERSION) in CMakeLists.txt, so bump that first.
#
# Run it by hand (workflow_dispatch) to build and package without
# publishing: the archives are left as workflow artifacts. That is how to
# try a change to this file before tagging.
#
# Each platform job builds its installers (6.2-6.4: Inno Setup .exe, .pkg,
# AppImage + VST3 tarball + .deb, via scripts/release/package.sh), then
# installs them on its throwaway runner, checks the result and uninstalls
# (scripts/release/smoke-test-*). Windows signing via SignPath (6.10) slots in
# before packaging once it's accepted.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a dry run, e.g. 1.0.0-beta.1 (blank: <project version>-dev.<run number>). Nothing is published."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same pin as ci.yml (D4); keep the two in lockstep.
  VCPKG_COMMIT: 319504a5326aa870edde46438c5455fa76305a56

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.v.outputs.label }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          project="$(sed -n 's/^project(MilkDAWp VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)"
          test -n "$project" || { echo "::error::No project(MilkDAWp VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            label="${GITHUB_REF_NAME#v}"
            publish=true
          else
            label="${INPUT_VERSION#v}"   # accept "v1.0.0-beta.1" like a tag
            label="${label:-$project-dev.$GITHUB_RUN_NUMBER}"
            publish=false
          fi
          # Same rule as MILKDAWP_VERSION_LABEL's check in CMakeLists.txt,
          # repeated here so a bad tag fails in seconds, not after a build.
          if [[ ! "$label" =~ ^${project//./\\.}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$label' doesn't match project(VERSION) $project. Bump CMakeLists.txt, or fix the tag."
            exit 1
          fi
          prerelease=false
          [[ "$label" == *-* ]] && prerelease=true
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "### MilkDAWp $label (pre-release: $prerelease, publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  # Windows and macOS on native runners, set up like ci.yml's native job but
  # without a compiler cache: release objects are always built from clean.
  # The vcpkg binary cache CI saved is read, never written.
  build-native:
    needs: version
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            preset: release-win
            triplet: x64-windows-dynamic
          - os: macos-latest
            platform: macos
            preset: release-mac
            triplet: arm64-osx-dynamic
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 6.2: builds the installer. The official installer pinned (URL and
      # SHA-256) in toolchain.json, installed silently into a known folder.
      # Not Chocolatey: its feed lags behind Inno Setup's releases.
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = (Get-Content toolchain.json -Raw | ConvertFrom-Json).windows.innoSetup
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$($pin.version).exe"
          Invoke-WebRequest $pin.url -OutFile $setup -UseBasicParsing
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $pin.sha256) { throw "Inno Setup download hash mismatch: got $hash, toolchain.json pins $($pin.sha256)" }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $proc = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/NOICONS", "/DIR=`"$dir`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($proc.ExitCode)" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No ISCC.exe in $dir" }
          "MILKDAWP_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_BINARY_CACHE_DIR"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # MILKDAWP_DEV_ALT_IDENTITY=OFF is the default; it's passed anyway so
      # a stray cache entry can never ship the dev identity (ADR-0007).
      # Default shell (pwsh on Windows), as in ci.yml: Git Bash puts its own
      # link.exe ahead of MSVC's on PATH.
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DMILKDAWP_DEV_ALT_IDENTITY=OFF
          "-DMILKDAWP_VERSION_LABEL=${{ needs.version.outputs.label }}"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Release presets build no tests (CI ran them on this commit); this
      # checks that the exact binary being shipped loads in a host and finds
      # projectM. Strictness 5 is the release gate (§8).
      - name: pluginval (VST3, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/pluginval.ps1 -Plugin build-release-win/plugin/milkdawp_plugin_artefacts/Release/VST3/MilkDAWp.vst3 -Strictness 5 -SkipGui
        env:
          MILKDAWP_REQUIRE_PROJECTM: "1"

      # vcpkg built projectM for arm64 only (the arm64-osx-dynamic triplet),
      # while the release preset builds universal binaries. projectM is
      # loaded at runtime, so the link succeeds either way, but Intel Macs
      # need an x86_64 slice: build it here and package.sh lipos it in.
      - name: Build x86_64 projectM (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-osx-dynamic \
            --overlay-triplets=triplets \
            --x-install-root=build-projectm-x64
          dylib="$(find build-projectm-x64/x64-osx-dynamic/lib -name 'libprojectM-4.*dylib' -type f | head -n 1)"
          test -n "$dylib" || { echo "::error::No x86_64 libprojectM-4 dylib"; exit 1; }
          lipo -archs "$dylib"
          echo "MILKDAWP_PROJECTM_X64_DYLIB=$PWD/$dylib" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          MILKDAWP_VCPKG_TRIPLET_DIR: build-${{ matrix.preset }}/vcpkg_installed/${{ matrix.triplet }}
        run: bash scripts/release/package.sh ${{ matrix.platform }} build-${{ matrix.preset }} "${{ needs.version.outputs.label }}" dist

      # 6.10: Authenticode-sign the installer through the SignPath Foundation
      # (docs/signing.md). Skipped until the repository variable
      # SIGNPATH_ORGANIZATION_ID exists, i.e. until SignPath has accepted the
      # project; until then releases ship unsigned with checksums and
      # attestations (D11). SignPath signs what it gets as a workflow
      # artifact, per packaging/windows/signpath-artifact-configuration.xml.
      - name: Upload the unsigned installer for signing (Windows)
        id: unsigned-installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Sign the installer with SignPath (Windows)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Use the signed installer (Windows)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist-signed -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no installer" }
          $status = (Get-AuthenticodeSignature $signed.FullName).Status
          if ($status -ne "Valid") { throw "The signed installer's signature is $status" }
          Copy-Item $signed.FullName (Join-Path dist $signed.Name) -Force
          "Signed: $($signed.Name)" >> $env:GITHUB_STEP_SUMMARY

      # Install what was just packaged on this throwaway runner, check it,
      # validate the installed plugin, start the app, uninstall. Never run
      # these on a developer machine: they install the real identity (D1).
      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/smoke-test-windows.ps1 -Dist dist -Version "${{ needs.version.outputs.label }}"

      - name: Smoke test the installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/release/smoke-test-macos.sh dist "${{ needs.version.outputs.label }}"

      - name: Upload pluginval log
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-pluginval-log-windows
          path: build-tools/pluginval-logs/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Linux in a plain ubuntu:22.04 container, not the devcontainer image: the
  # release must run on D9's floor (glibc 2.35), and binaries built on the
  # image's 24.04 need glibc 2.38 and GCC 13's libstdc++. linux-setup.sh
  # installs GCC 12, CMake, JUCE's dependencies and vcpkg; locally the same
  # script runs in `docker run ubuntu:22.04` (docs/releasing.md).
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    # An absolute path inside the container: in a container job
    # github.workspace is the host's path, not the container's.
    env:
      VCPKG_BINARY_CACHE_DIR: /opt/vcpkg-bincache
      VCPKG_BINARY_SOURCES: "clear;files,/opt/vcpkg-bincache,readwrite"
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null

      - uses: actions/checkout@v4

      - name: Set up the build environment
        run: bash scripts/release/linux-setup.sh

      # No CI job builds on 22.04, so this job keeps its own vcpkg cache.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-linux-2204-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-bin-linux-2204-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        run: |
          mkdir -p "$VCPKG_BINARY_CACHE_DIR"
          cmake --preset release-linux -DMILKDAWP_DEV_ALT_IDENTITY=OFF \
            "-DMILKDAWP_VERSION_LABEL=${{ needs.version.outputs.label }}"

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset release-linux

      - name: Package
        shell: bash
        env:
          MILKDAWP_VCPKG_TRIPLET_DIR: build-release-linux/vcpkg_installed/x64-linux-dynamic
        run: bash scripts/release/package.sh linux build-release-linux "${{ needs.version.outputs.label }}" dist

      # glibc floor, the AppImage's contents and start, pluginval on the
      # tarball's VST3, and the .deb's install / start / removal.
      - name: Smoke test the packages
        shell: bash
        run: bash scripts/release/smoke-test-linux.sh dist "${{ needs.version.outputs.label }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build-native, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestations
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum MilkDAWp-* milkdawp_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      # Anyone can check a download with:
      #   gh attestation verify <file> --repo Blue-Kachina/MilkDAWp
      - name: Attest build provenance
        if: needs.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/MilkDAWp-*
            dist/milkdawp_*

      - name: Keep the dry run's archives
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ needs.version.outputs.label }}
          path: dist/*

      - name: Publish GitHub Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LABEL: ${{ needs.version.outputs.label }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes-header.md <<EOF
          Each installer has the app, the plugin and about 9,800 bundled presets.

          - **Windows (10 21H2+, x64):** \`MilkDAWp-${LABEL}-windows-x64-setup.exe\` installs the
            VST3, the app and the presets, plus the Visual C++ runtime if it's missing. Not
            code-signed yet, so SmartScreen may warn (More info > Run anyway). The
            \`-symbols.zip\` is only for reading crash reports.
          - **macOS (12+, Apple Silicon and Intel):** \`MilkDAWp-${LABEL}-macos-universal.pkg\`
            installs the app, VST3, AU and presets. It isn't from an identified developer, so
            the first time Control-click it > Open > Open.
          - **Linux (Ubuntu 22.04+ / glibc 2.35+, x64):** the \`.AppImage\` is the app;
            \`-linux-x64-vst3.tar.gz\` has the VST3 and an \`install-vst3.sh\`; on Debian/Ubuntu the
            \`.deb\` installs both system-wide.

          **Verify a download:** compare it with \`SHA256SUMS.txt\`, or run
          \`gh attestation verify <file> --repo ${GH_REPO}\`.
          EOF
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "MilkDAWp $LABEL" \
            --notes-file notes-header.md \
            --generate-notes \
            "${flags[@]}"
