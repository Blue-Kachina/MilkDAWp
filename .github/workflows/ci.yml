name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in lockstep with vcpkg-configuration.json's default-registry baseline
  # (development_roadmap.md D4) so the vcpkg tool and the ports it resolves
  # come from the same tested commit. Only used on macOS/Windows -- the Linux
  # jobs get vcpkg (and a pre-warmed projectM binary cache) from the
  # devcontainer image instead (0.10).
  VCPKG_COMMIT: 319504a5326aa870edde46438c5455fa76305a56

jobs:
  # macOS and Windows: native runners, no container (CI *is* the build farm
  # for these two per §4.10 -- there's no way to containerize a DAW-grade
  # Windows/macOS build). vcpkg is fetched each run; its binary packages are
  # cached with vcpkg's `files` provider plus actions/cache (vcpkg removed its
  # x-gha backend, so that silently cached nothing).
  build-and-test-native:
    # Job-level on purpose: a workflow-level `clear;...` would also wipe the
    # devcontainer image's pre-built cache in the Linux jobs below.
    env:
      VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: ci-mac
          - os: windows-latest
            preset: ci-win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Exact key: same vcpkg commit, manifest, triplets and overlay ports.
      # restore-keys falls back to the newest cache for this OS and vcpkg
      # commit, so a manifest change only rebuilds what actually changed.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_BINARY_CACHE_DIR"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      # Saved straight after Configure (where vcpkg installs), and even if a
      # later step fails, so a red build still warms the cache. Skipped on an
      # exact hit: nothing new to store.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # 3.9. No GUI tests: the runner has no GPU, only Windows' GL 1.1
      # software renderer, which can't create the editor's GL context. Run
      # scripts/pluginval.ps1 locally for the editor tests.
      - name: pluginval (VST3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/pluginval.ps1 -Strictness 10 -Repeat 3 -SkipGui

      - name: Upload pluginval log
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: build-tools/pluginval-logs/

  # Linux: runs *inside* the published devcontainer image (0.10), which
  # already has GCC+Clang, CMake, Ninja, JUCE pre-fetched, and projectM's
  # dependency tree pre-built into vcpkg's binary cache. No apt-get, no
  # separate vcpkg setup -- CI and a local devcontainer are the same image.
  #
  # Bootstrapping note: this job needs the devcontainer image to already
  # exist in GHCR. On a brand new repo, run the "Devcontainer image"
  # workflow once (workflow_dispatch) before this job can succeed.
  #
  # The image name is a literal: the env context isn't available to
  # jobs.<id>.container (the whole workflow fails to parse), and GHCR
  # names must be lowercase (repository_owner is "Blue-Kachina").
  build-and-test-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/blue-kachina/milkdawp2-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      # MILKDAWP_REQUIRE_HEADLESS_RENDER: projectM and Mesa's surfaceless EGL
      # are both in the image, so the headless render tests (2.7) must really
      # render here; "unavailable" fails instead of quietly passing.
      - name: Test
        run: ctest --preset ci-linux
        env:
          MILKDAWP_REQUIRE_HEADLESS_RENDER: "1"

      - name: mdw-analyze fixture suite (metric gate, 1.10)
        run: |
          cmake --build --preset ci-linux --target mdw-analyze
          ./build-ci-linux/tools/mdw-analyze/mdw-analyze --suite fixtures --thresholds fixtures/thresholds.json

  # Sanitizer jobs (0.4, §8): also inside the devcontainer image (Clang is
  # already installed there). No projectM/plugin -- these exist to catch bugs
  # in milkdawp_core (and milkdawp_engine once it has tests), not to
  # sanitize JUCE or projectM's own code.
  sanitize:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/blue-kachina/milkdawp2-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-linux-asan, ci-linux-tsan, ci-linux-rtsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
