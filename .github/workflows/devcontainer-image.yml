name: Devcontainer image

# Builds and publishes the devcontainer image to GHCR whenever anything that
# affects its contents changes (0.10): the Dockerfile itself, the vcpkg
# manifest/registry pins, or the JUCE FetchContent pin. CI (ci.yml) then runs
# *inside* this published image, so "works in the container" and "works in
# CI" cannot drift apart (§10 risk: devcontainer drift).
on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "triplets/**"
      - "vcpkg-overlays/**"
      - "cmake/FetchJuce.cmake"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch: {}

env:
  # Literal and lowercase: GHCR rejects uppercase, and repository_owner is
  # "Blue-Kachina". ci.yml's container jobs use the same literal.
  IMAGE_NAME: ghcr.io/blue-kachina/milkdawp2-devcontainer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
